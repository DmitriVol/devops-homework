name: API Smoke Test

on:
  workflow_dispatch:

# API Gateway URLs are stable — they only change if the resource is destroyed
# and recreated. Update here if that ever happens.
jobs:
  smoke:
    name: "Smoke test — ${{ matrix.env }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run both environments even if one fails
      matrix:
        include:
          - env: staging
            url: https://2mmdl69iw9.execute-api.us-east-1.amazonaws.com/health
          - env: prod
            url: https://lt6j035ztb.execute-api.us-east-1.amazonaws.com/health

    steps:
      - name: "Healthy request → expect 200 + healthy body"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ matrix.url }}" \
            -H "Content-Type: application/json" \
            -d '{"payload": "hello"}')
          echo "Status: $STATUS" && cat /tmp/body.json | jq
          [ "$STATUS" = "200" ] || { echo "FAIL: expected 200, got $STATUS"; exit 1; }
          jq -e '.status == "healthy"' /tmp/body.json || { echo "FAIL: body missing status=healthy"; exit 1; }

      - name: "Missing payload → expect 400"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ matrix.url }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Status: $STATUS" && cat /tmp/body.json | jq
          [ "$STATUS" = "400" ] || { echo "FAIL: expected 400, got $STATUS"; exit 1; }

      - name: "Empty payload → expect 400"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ matrix.url }}" \
            -H "Content-Type: application/json" \
            -d '{"payload": ""}')
          echo "Status: $STATUS" && cat /tmp/body.json | jq
          [ "$STATUS" = "400" ] || { echo "FAIL: expected 400, got $STATUS"; exit 1; }

      - name: "Null payload → expect 400"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ matrix.url }}" \
            -H "Content-Type: application/json" \
            -d '{"payload": null}')
          echo "Status: $STATUS" && cat /tmp/body.json | jq
          [ "$STATUS" = "400" ] || { echo "FAIL: expected 400, got $STATUS"; exit 1; }

      - name: "Malformed JSON → expect 400"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ matrix.url }}" \
            -H "Content-Type: application/json" \
            -d 'not-json')
          echo "Status: $STATUS" && cat /tmp/body.json | jq
          [ "$STATUS" = "400" ] || { echo "FAIL: expected 400, got $STATUS"; exit 1; }

      - name: "GET method → expect 400"
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" -X GET "${{ matrix.url }}")
          echo "Status: $STATUS" && cat /tmp/body.json
          [ "$STATUS" = "400" ] || { echo "FAIL: expected 400, got $STATUS"; exit 1; }

