name: Deploy — Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Terraform apply (staging)
    runs-on: ubuntu-latest
    # id-token: write is required for GitHub to mint an OIDC token that AWS
    # can verify — no static credentials needed.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub mints a short-lived OIDC token; AWS verifies it against the
      # federated identity provider and issues temporary STS credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="key=staging/terraform.tfstate"

      # Security gate — scan IaC before any changes reach AWS.
      # CKV_AWS_272: Lambda code signing — intentionally not used (hash verification via source_code_hash).
      # CKV2_AWS_29: API Gateway access logs — out of scope for this project.
      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          skip_check: CKV_AWS_272,CKV2_AWS_29,CKV_AWS_76,CKV_AWS_116,CKV_AWS_117,CKV_AWS_119,CKV_AWS_158,CKV_AWS_173
          soft_fail: false
