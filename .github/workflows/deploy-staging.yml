name: Deploy — Staging

on:
  push:
    branches: [main]

jobs:
  plan:
    name: Plan (staging)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub mints a short-lived OIDC token; AWS verifies it against the
      # federated identity provider and issues temporary STS credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="key=staging/terraform.tfstate"

      # Scan Lambda dependencies for known CVEs before touching infrastructure.
      # boto3 is runtime-provided and not listed; this guards any future additions.
      - name: Lambda dependency scan
        run: |
          pip install pip-audit --quiet
          pip-audit -r lambda/requirements.txt --skip-editable

      # Security gate — scan IaC before any changes reach AWS.
      # Skipped checks (intentional design decisions):
      #   CKV_AWS_272  — Lambda code signing: not used, hash verification via source_code_hash
      #   CKV2_AWS_29  — API Gateway access logs: out of scope
      #   CKV_AWS_309  — API GW route auth type: endpoint is intentionally public (no auth)
      #   CKV_AWS_76   — API GW stage access logging: out of scope
      #   CKV_AWS_115  — Lambda reserved concurrency: account limit = 10 (AWS minimum), reservation impossible
      #   CKV_AWS_116  — Lambda DLQ: n/a for synchronous API Gateway invocations
      #   CKV_AWS_117  — Lambda in VPC: would require NAT gateway, out of scope
      #   CKV_AWS_119  — DynamoDB KMS CMK: AWS-managed keys are sufficient
      #   CKV_AWS_158  — CloudWatch KMS: same reasoning
      #   CKV_AWS_173  — Lambda env var KMS: TABLE_NAME is not a secret
      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          skip_check: CKV_AWS_272,CKV2_AWS_29,CKV_AWS_309,CKV_AWS_76,CKV_AWS_115,CKV_AWS_116,CKV_AWS_117,CKV_AWS_119,CKV_AWS_158,CKV_AWS_173
          soft_fail: false

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -var-file="staging.tfvars" -out=tfplan

      # Save the plan so the apply job executes exactly what was reviewed —
      # no re-planning against potentially drifted state.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply (staging)
    needs: plan
    runs-on: ubuntu-latest
    # Pauses here for a required reviewer in GitHub → Settings → Environments → staging
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="key=staging/terraform.tfstate"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: terraform

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply tfplan
